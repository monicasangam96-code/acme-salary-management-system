spring:
  application:
    name: acme-salary-mgmt

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/salary_mgmt?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8mb4}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpass}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: false
        same-site: lax

  tomcat:
    remote-ip:
      header: x-forwarded-for
      protocol-header: x-forwarded-proto

# Logging — NEVER log salary amounts
logging:
  level:
    com.acme.salarymgmt: INFO
    org.springframework.security: INFO
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
