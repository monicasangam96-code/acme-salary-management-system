version: "3.9"

services:
  # ---- MySQL (shared state) ----
  db:
    image: mysql:9.7
    container_name: acme-db
    restart: unless-stopped
    env_file: ../build/dev/.env
    volumes:
      - mysql-data:/var/lib/mysql
      - ../code/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../code/db/init_data.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ../code/db/seed_sample.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --log-bin-trust-function-creators=1
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - acme-net

  # ---- Backend API (Spring Boot) ----
  api:
    build:
      context: ../../code/back-end
      dockerfile: Dockerfile
    container_name: acme-api
    restart: unless-stopped
    env_file: ../build/dev/.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - acme-net

  # ---- Frontend (Angular + Nginx) ----
  web:
    build:
      context: ../../code/front-end
      dockerfile: Dockerfile
    container_name: acme-web
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - acme-net

volumes:
  mysql-data:

networks:
  acme-net:
    driver: bridge
